name: Promemoria scadenza Certificati Medici

# Mirror di sincronizza-fipav.yml (Story 10.12), stesso principio "cron
# esterno via HTTP", ma senza il gate di frequenza configurabile dall'app:
# app/api/cron/promemoria-certificati/route.ts confronta i giorni alla
# scadenza per data di calendario (Europe/Rome), non per timestamp - una
# seconda invocazione nello stesso giorno rimanderebbe lo stesso promemoria
# a Dirigenti e famiglie collegate (non solo alle Atlete). Va quindi
# schedulato al massimo una volta al giorno, qui direttamente (nessuna
# cadenza configurabile necessaria, a differenza della sincronizzazione
# FIPAV che tollera/vuole un battito piu' frequente).
on:
  schedule:
    # 6:00 UTC = 7:00 CET / 8:00 CEST (ora italiana) - un orario mattutino
    # ragionevole per l'unico invio del giorno, non e' arbitrario come
    # l'ora del battito orario di sincronizza-fipav.yml.
    - cron: "0 6 * * *"
  # Permette di lanciare il workflow a mano da GitHub Actions (verifica
  # manuale) - attenzione: un lancio manuale nello stesso giorno del
  # battito schedulato rimanderebbe gli stessi promemoria (vedi sopra e
  # Fase 6ter di docs/deploy-produzione.md). Il blocco "concurrency" sotto
  # impedisce solo due esecuzioni DAVVERO in parallelo, non un secondo
  # invio nello stesso giorno in momenti diversi - quel rischio resta,
  # segnalato esplicitamente, non risolto qui (richiederebbe un
  # meccanismo di idempotenza lato app, fuori scope per questa modifica
  # minima).
  workflow_dispatch:

# Review fix (Blind Hunter): senza un gruppo di concorrenza, un
# workflow_dispatch manuale che si sovrappone al battito schedulato (o un
# retry di GitHub Actions) potrebbe eseguire due chiamate DAVVERO in
# parallelo. Non elimina il rischio di doppio invio nello stesso giorno
# (serializza soltanto, vedi sopra), ma e' un irrigidimento standard a
# costo zero.
concurrency:
  group: promemoria-certificati
  cancel-in-progress: false

jobs:
  promemoria-certificati:
    runs-on: ubuntu-latest
    # Review fix (Blind Hunter): il job non tocca mai la API di GitHub
    # (solo una curl verso un servizio esterno) - GITHUB_TOKEN non serve.
    permissions: {}
    # Review fix (Blind Hunter): a differenza di sincronizza-fipav.yml (un
    # solo fetch esterno bounded), questo endpoint invia una vera email
    # SMTP per Certificato in scadenza trovato, in sequenza - un timeout
    # copiato invariato dal sibling rischiava di interrompere l'invio a
    # meta' se piu' Certificati scadono lo stesso giorno.
    timeout-minutes: 10
    steps:
      - name: Chiama l'endpoint dei promemoria scadenza Certificati Medici
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 --retry 2 --retry-delay 5 --retry-connrefused \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_ENDPOINT_URL%/}/api/cron/promemoria-certificati"
        env:
          # Stesso CRON_SECRET/CRON_ENDPOINT_URL gia' configurati per
          # sincronizza-fipav.yml (Story 10.12) - nessun nuovo secret da
          # aggiungere, vedi docs/deploy-produzione.md Fase 6bis.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_ENDPOINT_URL: ${{ secrets.CRON_ENDPOINT_URL }}
