name: Sincronizzazione automatica FIPAV

# Story 10.12: "battito" fisso ogni ora - la cadenza REALE della
# sincronizzazione (quante ore devono passare prima che esegua davvero) e'
# decisa da app/api/cron/sincronizza-fipav (ConfigurazioneApplicazione.frequenzaSincronizzazioneFipavOre,
# editabile da un Admin su /app/impostazioni, nessun redeploy necessario per
# cambiarla). Un cambio di cadenza non richiede mai di modificare questo file.
on:
  schedule:
    - cron: "0 * * * *"
  # Permette di lanciare il workflow a mano da GitHub Actions (verifica
  # manuale, senza aspettare il prossimo battito orario).
  workflow_dispatch:

jobs:
  sincronizza-fipav:
    runs-on: ubuntu-latest
    # Review fix (Blind Hunter, propagato dal workflow gemello
    # promemoria-certificati.yml): il job non tocca mai la API di GitHub
    # (solo una curl verso un servizio esterno) - GITHUB_TOKEN non serve.
    permissions: {}
    # Review fix (Blind Hunter): senza un timeout esplicito sul job, un
    # endpoint bloccato (es. il Worker in stallo su un fetch al portale
    # FIPAV) terrebbe il job appeso fino al limite di default di GitHub (6
    # ore), consumando inutilmente minuti Actions.
    timeout-minutes: 5
    steps:
      - name: Chiama l'endpoint di sincronizzazione FIPAV
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_ENDPOINT_URL%/}/api/cron/sincronizza-fipav"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Review fix (Blind Hunter): "${CRON_ENDPOINT_URL%/}" rimuove un
          # eventuale slash finale dal secret (es. se configurato come
          # "https://.../workers.dev/") - senza, l'URL richiesta avrebbe un
          # doppio slash prima di "/api/cron/...".
          CRON_ENDPOINT_URL: ${{ secrets.CRON_ENDPOINT_URL }}
