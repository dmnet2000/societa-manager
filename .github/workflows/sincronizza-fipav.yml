name: Sincronizzazione automatica FIPAV

# Story 10.12 (review fix, 2026-09-28): battito ogni 10 minuti (prima ogni
# ora) - app/api/cron/sincronizza-fipav elabora UN SOLO Campionato per
# invocazione (il meno recentemente sincronizzato in rotazione), mai tutti
# insieme: un bug di produzione con l'elaborazione multi-Campionato per
# chiamata (prima sequenziale, poi in parallelo) rischiava sia un timeout
# lato workflow sia di bombardare il portale FIPAV con piu' richieste
# ravvicinate. Con piu' Campionati, la rotazione completa richiede piu'
# battiti (es. 5 Campionati = 50 minuti per il giro completo) - la cadenza
# REALE di ri-sincronizzazione di un singolo Campionato resta decisa da
# ConfigurazioneApplicazione.frequenzaSincronizzazioneFipavOre (editabile
# da /app/impostazioni, nessun redeploy necessario per cambiarla).
on:
  schedule:
    - cron: "*/10 * * * *"
  # Permette di lanciare il workflow a mano da GitHub Actions (verifica
  # manuale, senza aspettare il prossimo battito).
  workflow_dispatch:

jobs:
  sincronizza-fipav:
    runs-on: ubuntu-latest
    # Review fix (Blind Hunter): il job non tocca mai la API di GitHub
    # (solo una curl verso un servizio esterno) - GITHUB_TOKEN non serve.
    permissions: {}
    # Review fix (Blind Hunter): senza un timeout esplicito sul job, un
    # endpoint bloccato terrebbe il job appeso fino al limite di default di
    # GitHub (6 ore), consumando inutilmente minuti Actions. Un solo
    # Campionato per invocazione (vedi sopra) rende 5 minuti abbondanti.
    timeout-minutes: 5
    steps:
      - name: Chiama l'endpoint di sincronizzazione FIPAV
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_ENDPOINT_URL%/}/api/cron/sincronizza-fipav"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Review fix (Blind Hunter): "${CRON_ENDPOINT_URL%/}" rimuove un
          # eventuale slash finale dal secret (es. se configurato come
          # "https://.../workers.dev/") - senza, l'URL richiesta avrebbe un
          # doppio slash prima di "/api/cron/...".
          CRON_ENDPOINT_URL: ${{ secrets.CRON_ENDPOINT_URL }}
